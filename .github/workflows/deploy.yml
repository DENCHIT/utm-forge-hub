name: Build & publish SPA + API

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # Create an 'out' bundle that contains:
      # - built SPA from dist/
      # - your api/ folder
      # - the root .htaccess
      - name: Prepare deploy bundle
        run: |
          rm -rf out && mkdir -p out
          # copy SPA build
          cp -r dist/* out/
          # copy API if present
          if [ -d api ]; then
            mkdir -p out/api
            cp -r api/* out/api/
          fi
          # copy root .htaccess if present
          if [ -f .htaccess ]; then
            cp .htaccess out/.htaccess
          fi
          # ensure a favicon to avoid 404s
          [ -f out/favicon.ico ] || printf '\x00' > out/favicon.ico

      # Publish the combined bundle to the 'deploy' branch
      - name: Publish bundle to deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: deploy
          force_orphan: true

