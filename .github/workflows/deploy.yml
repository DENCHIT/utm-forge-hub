name: Build & publish dist to deploy
on:
  push:
    branches: [ main ]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # IMPORTANT: use 'npm install', not 'npm ci' (your lockfile is out of sync)
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # Ensure SPA fallback exists in the built output
      - name: Add .htaccess for SPA
        run: |
          cat > dist/.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      # (Optional) favicon – avoids 404, safe to skip if you already have one
      - name: Ensure favicon
        run: |
          if [ ! -f dist/favicon.ico ]; then
            printf '\x00' > dist/favicon.ico
          fi

      # Publish the compiled 'dist/' to branch 'deploy'
      - name: Publish dist to deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true

      # Quick debug output in the Actions log
      - name: List dist
        run: ls -la dist && sed -n '1,40p' dist/index.html
