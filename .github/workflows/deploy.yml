name: Build & publish SPA + API

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # Bundle SPA + API; copy .htaccess files from repo
      - name: Prepare deploy bundle
        run: |
          set -e
          rm -rf out && mkdir -p out
          cp -r dist/* out/
          if [ -d api ]; then mkdir -p out/api && cp -r api/* out/api/; fi
          if [ -f .htaccess ]; then cp .htaccess out/.htaccess; fi
          if [ -f api/.htaccess ]; then mkdir -p out/api && cp api/.htaccess out/api/.htaccess; fi
          [ -f out/favicon.ico ] || printf '\x00' > out/favicon.ico

      - name: Publish bundle to deploy (no orphaning)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: deploy
          commit_message: "deploy: ${{ github.sha }}"
