name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Prepare upload directory
        run: |
          rm -rf upload && mkdir -p upload
          # Copy built frontend
          cp -r dist/* upload/
          # Copy root .htaccess to upload directory
          cp .htaccess upload/.htaccess
          # Copy PHP API folder
          mkdir -p upload/api
          cp -r api/*.php upload/api/
          cp api/.htaccess upload/api/.htaccess
          # Never ship the example config
          rm -f upload/api/config.example.php

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: upload/
          server-dir: public_html/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
