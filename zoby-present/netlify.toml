[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Client-side routing: /join/ZOBY26 has no file on disk.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Fingerprinted filenames, so cache them for ever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html is not fingerprinted. If phones cache it, a fix deployed mid-event
# never reaches them.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
